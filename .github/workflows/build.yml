name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scompatta
        run: |
          mkdir proj
          unzip -q "$(ls *.zip | head -1)" -d proj
          echo "DIR=$(dirname "$(find proj -name build.gradle | head -1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Compila
        run: gradle build
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-gems
          path: ${{ env.DIR }}/build/libs/infinity-gems-1.0.0.jar
